# Server
server.port=8080

# Application
spring.application.name=mitti2market-backend

# Active profile (dev by default)
spring.profiles.active=dev

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/mitti2market?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=rudra2006

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console disabled (using MySQL)
spring.h2.console.enabled=false

# CORS — allow the Vite dev server
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# File upload
app.upload.dir=uploads/produce
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
