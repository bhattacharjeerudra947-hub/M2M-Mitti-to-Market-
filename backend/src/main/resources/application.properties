# ═══════════════════════════════════════════════════════════════
# Mitti2Market Backend — Configuration
# ═══════════════════════════════════════════════════════════════
# Secrets are read from environment variables (DB_PASSWORD, etc.)
# Non-sensitive defaults are kept here.
# ═══════════════════════════════════════════════════════════════

# Server
server.port=${SERVER_PORT:8080}

# Application
spring.application.name=mitti2market-backend

# Active profile (dev by default)
spring.profiles.active=dev

# ─── MySQL Database ──────────────────────────────────────────
# Credentials come from env vars — never hardcode passwords here
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mitti2market?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console disabled (using MySQL)
spring.h2.console.enabled=false

# ─── CORS ────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}

# ─── File Storage ──────────────────────────────────────────
# Type: 'local' for development, 's3' for production (AWS S3, MinIO, etc.)
app.storage.type=${STORAGE_TYPE:local}
app.storage.root=${STORAGE_ROOT:storage}

# Legacy upload dir (for product images)
app.upload.dir=${UPLOAD_DIR:uploads/produce}
app.upload.max-size=${UPLOAD_MAX_SIZE:5242880}

# S3 Configuration (only needed when app.storage.type=s3)
# STORAGE_ENDPOINT=https://your-s3-endpoint
# STORAGE_ACCESS_KEY=your-access-key
# STORAGE_SECRET_KEY=your-secret-key
# STORAGE_BUCKET=your-bucket-name
# STORAGE_REGION=us-east-1

# ─── Cloudinary ─────────────────────────────────────────────
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ─── Route / Logistics Intelligence ─────────────────────────
# ROUTING_API_URL: OSRM-compatible server (e.g. https://router.project-osrm.org)
# When blank, a haversine straight-line × road-factor fallback is used and
# results are clearly labelled as coarse estimates. Never hardcode keys here.
route.avg-speed-kmh=${ROUTE_AVG_SPEED_KMH:40}
routing.api-url=${ROUTING_API_URL:}

# Transport cost assumptions (₹) — labelled estimates
cost.fuel-price-per-litre=${COST_FUEL_PRICE:100}
cost.vehicle-mileage-kmpl=${COST_VEHICLE_MILEAGE:12}
cost.driver-cost-per-day=${COST_DRIVER_PER_DAY:1200}
cost.toll-per-km=${COST_TOLL_PER_KM:1.5}
cost.handling-per-kg=${COST_HANDLING_PER_KG:0.25}
cost.platform-fee-rate=${COST_PLATFORM_FEE_RATE:0.005}

# ─── JWT ────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET:Mitti2Market2026SuperSecretKeyForSIHProjectDoNotUseInProduction}
jwt.access-token-ttl=86400000
jwt.refresh-token-ttl=604800000

