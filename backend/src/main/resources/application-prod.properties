# Production Profile — MySQL
# Set these environment variables before starting:
#   DB_URL, DB_USERNAME, DB_PASSWORD

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mitti2market?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rudra2006}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# H2 Console disabled
spring.h2.console.enabled=false

# CORS — override via APP_CORS_ALLOWED_ORIGINS env var if needed
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
