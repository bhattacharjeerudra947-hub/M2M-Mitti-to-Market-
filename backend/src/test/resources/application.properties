# ═══════════════════════════════════════════════════════════════
# Mitti2Market Backend — Test Configuration
# ═══════════════════════════════════════════════════════════════
# Overrides application.properties for unit/integration tests.
# Uses in-memory H2 database and stub values so tests run without
# a real MySQL server, .env file, or any external services.
# ═══════════════════════════════════════════════════════════════

# Server
server.port=0

# ─── In-memory H2 Database (replaces MySQL for tests) ───────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ─── File Storage ──────────────────────────────────────────
app.storage.type=local
app.storage.root=target/test-storage
app.upload.dir=target/test-uploads
app.upload.max-size=5242880

# ─── CORS ────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ─── Cloudinary (stub values — not called in tests) ─────────
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

# ─── Mandi price API ─────────────────────────────────────────
mandi.api.key=test-mandi-key
mandi.api.url=https://api.data.gov.in/resource/9ef84268-d588-465a-a308-a864a43d0070

# ─── AI (Gemini) ─────────────────────────────────────────────
gemini.api.key=test-gemini-key
gemini.model=gemini-3.6-flash

# ─── Route / Logistics ───────────────────────────────────────
route.avg-speed-kmh=40
routing.api-url=

# ─── Transport cost assumptions ──────────────────────────────
cost.fuel-price-per-litre=100
cost.vehicle-mileage-kmpl=12
cost.driver-cost-per-day=1200
cost.toll-per-km=1.5
cost.handling-per-kg=0.25
cost.platform-fee-rate=0.005

# ─── JWT ────────────────────────────────────────────────────
jwt.secret=TestSecretKeyForMitti2MarketTestSuiteOnlyNotForProduction
jwt.access-token-ttl=86400000
jwt.refresh-token-ttl=604800000

# ─── MSG91 OTP ──────────────────────────────────────────────
msg91.authkey=
msg91.template-id=
